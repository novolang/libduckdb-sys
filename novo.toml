[package]
name        = "libduckdb-sys"
version     = "0.1.1"
description = "Bindings over libduckdb, the DuckDB C API: the database and the connection, the configuration, a query and its result, the row-at-a-time value readers, the prepared statement with its binds, and the library's own allocator, one declaration per C entry point."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used
# the package yet, and the tests exercise the entry points rather than
# a consumer's use of them.
stability   = "experimental"

# `sys`: the layer for a package that binds one C library and decides
# nothing of its own.  Every `pub fn` below is an `@ffi` declaration of
# a function in the DuckDB C API.
layer       = "sys"

category    = "bindings"

# The one C library.  `libduckdb.so` is what the loader resolves these
# symbols against.  Installing this package does not install it.
wraps       = "libduckdb"

tags        = ["ffi", "duckdb", "sql", "olap", "analytics", "database", "bindings"]
repository  = "https://github.com/novolang/libduckdb-sys"
maintainers = ["novo-lang"]
novo        = ">= 0.8.9"

[docs.pages]
"README.md" = "The C entry points of DuckDB, one novo-lang declaration each"

[dependencies]
# None.  A binding over one C library depends on no novo-lang package.

# The link flag for the `library = "duckdb"` name every declaration in
# `src/` carries.  DuckDB ships as a zip holding `duckdb.h` and
# `libduckdb.so`, and it installs no pkg-config file.  There is
# therefore no `libduckdb.pc` to ask, and the flag is written out here.
# The default would be the same `-lduckdb`.  The block is here so a
# reader knows which flag to add a `-L` to, because the zip is unpacked
# wherever the reader put it rather than anywhere the linker already
# looks.
[ffi.duckdb]
linker = "-lduckdb"
